name: Run Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r $GITHUB_WORKSPACE/recondesk-backend/requirements.txt

      - name: Run tests
        run: pytest $GITHUB_WORKSPACE/recondesk-backend/tests/ -v --tb=short
