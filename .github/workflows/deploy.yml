name: Run Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: recondesk-backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: recondesk-backend
        run: pytest tests/
