name: Run Tests
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Debug - show files
        run: ls -la && ls -la recondesk-backend/ || echo "FOLDER EMPTY OR MISSING"
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r recondesk-backend/requirements.txt
      - name: Run tests
        run: pytest recondesk-backend/tests/ -v --tb=short
