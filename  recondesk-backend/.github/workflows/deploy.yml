name: Run Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          ls -la
          cd "recondesk-backend"
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd "recondesk-backend"
          pytest tests/
