services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: always

  web:
    build:
      context: ./recondesk-backend
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AURORA_DATABASE_URL=${AURORA_DATABASE_URL}
      - AURORA_DB_ENABLED=${AURORA_DB_ENABLED:-true}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-ap-south-1_nvlPYMvFh}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-2qui5lp7if0g4lftbrag7o6sce}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET:-55vbhfh2kij0crl7c1tf39go9g034n7flvocgt0a508gcg5uht6}
      - COGNITO_AUTH_ENABLED=true
    env_file: .env
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./recondesk-backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker -Q reconciliation,imports,gstn,filing,exports,notifications,maintenance --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AURORA_DATABASE_URL=${AURORA_DATABASE_URL}
      - AURORA_DB_ENABLED=${AURORA_DB_ENABLED:-true}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-ap-south-1_nvlPYMvFh}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-2qui5lp7if0g4lftbrag7o6sce}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET:-55vbhfh2kij0crl7c1tf39go9g034n7flvocgt0a508gcg5uht6}
      - COGNITO_AUTH_ENABLED=true
    env_file: .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always

volumes:
  caddy_data:
  caddy_config:
  redis_data:
