version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: always

  web:
    build:
      context: ./recondesk-backend
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./recondesk-backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always

volumes:
  caddy_data:
  caddy_config:
  redis_data:
